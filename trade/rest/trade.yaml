openapi: 3.0.3

info:
  title: Trade API
  description: API for managing trade
  version: 1.0.0

servers:
  - url: http://{hostname}:{port}/api/
    variables:
      hostname:
        default: localhost
      port:
        default: '8080'

tags:
  - name: Item Listing
    description: Operations related to item listings

paths:
  /item-listings:
    post:
      operationId: createItemListing
      tags:
        - Item Listing
      summary: Create item listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemListingRequestDTO'
      responses:
        '201':
          description: Item listing created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItemListingResponseDTO'

components:
  schemas:
    CreateItemListingRequestDTO:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemDTO'
        publish:
          type: boolean

    CreateItemListingResponseDTO:
      type: object
      required:
        - items
        - published
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemDTO'
        published:
          type: boolean

    ItemDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string